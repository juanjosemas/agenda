<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Plan Semanal Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&family=Amatic+SC:wght@700&family=Caveat:wght@700&family=Dancing+Script:wght@700&family=Lobster&family=Metal+Mania&family=Yellowtail&family=Permanent+Marker&family=Piedra&family=Sriracha&display=swap" rel="stylesheet">
    </head>

<body>
    <div class="wood-background">
         <header class="top-bar">
             <div class="date-info">
                <span id="month-year">---</span>
                <small id="week-display">Semana --</small>
        
            </div>
            <div class="icons">         
                <input type="date" id="date-search-input" onchange="jumpToDate(this.value)">
                <button class="icon-btn" onclick="document.getElementById('date-search-input').showPicker()" title="Buscar Fecha">🔍</button>
                <button class="icon-btn" onclick="openSummary()" title="Ver todas las notas">📋</button>
                <button class="icon-btn" onclick="goToToday()" title="Ir a Hoy">📅</button>
                <button class="icon-btn" onclick="toggleSettings()" title="Ajustes">⚙️</button>
            </div>
        </header>

        <div class="notebook-container is-closed" id="swipe-area">
            
            <!-- PORTADA DE LA LIBRETA -->
            <div class="notebook-cover" onclick="openNotebook()">
                <div class="cover-decoration"></div>
                <h1>AGENDA</h1>
                <p>Mi Plan Semanal</p>
                <div class="cover-decoration"></div>
                <small style="color:rgba(255,215,0,0.5); font-style:italic;">Clic para abrir</small>
            </div>

            <div class="page left-page">
                <div class="lines-container" id="lines-l"></div>
            </div>

            <div class="spiral">
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
            </div>

            <div class="page right-page">
                <div class="lines-container" id="lines-r"></div>
            </div>
        </div>
    </div>

    <!-- MODAL DE AJUSTES -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Ajustes de Agenda</h3>
            
            <div class="setting-item">
                <label>Vista:</label>
                <select id="setting-view" onchange="applySettings()">
                    <option value="double">Abierta (2 días)</option>
                    <option value="single">Simple (1 día)</option>
                </select>
            </div>

            <div class="setting-item">
                <label>Papel:</label>
                <select id="setting-paper" onchange="applySettings()">
                    <option value="plain">Blanco</option>
                    <option value="ruled">Rayado</option>
                    <option value="grid">Cuadriculado</option>
                </select>
            </div>

            <div class="setting-item">
                <label>Tamaño Letra:</label>
                <select id="setting-font-size" onchange="applySettings()">
                    <option value="small">Pequeño</option>
                    <option value="medium">Normal</option>
                    <option value="large">Grande</option>
                </select>
            </div>

            <hr>
            <h4>Acciones</h4>
            <button class="btn-block" onclick="closeNotebook(); toggleSettings();">📕 Cerrar Libreta</button>
            
            <button class="btn-block" style="color: #a32a2a; font-weight: bold; margin-top: 10px;" onclick="clearAllData()">⚠️ Borrar toda la agenda</button>

            <button class="btn-block" style="background:#333; color:white; margin-top:20px" onclick="toggleSettings()">Cerrar</button>
        </div>
    </div>

    <!-- MODAL DE RESUMEN DE NOTAS (ÍNDICE) -->
    <div id="summary-modal" class="modal-overlay">
        <div class="modal-content wide">
            <h3>Índice de Notas</h3>
            <div id="summary-list-container" class="summary-list"></div>
            <button class="btn-block" style="background:#333; color:white; margin-top:20px" onclick="closeSummary()">Cerrar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
