<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Plan Semanal Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&family=Amatic+SC:wght@700&family=Caveat:wght@700&family=Dancing+Script:wght@700&family=Lobster&family=Metal+Mania&family=Yellowtail&family=Permanent+Marker&family=Piedra&family=Sriracha&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Capa oscura para cerrar el menú -->
    <div id="menu-overlay" class="menu-overlay" onclick="toggleMenu()"></div>

    <!-- Menú Lateral Desplegable -->
    <nav id="side-menu" class="side-menu">
        <div class="menu-header">
            <h3>Opciones</h3>
            <button class="close-menu" onclick="toggleMenu()">×</button>
        </div>
        <div class="menu-content"> 
            <button class="menu-item" onclick="document.getElementById('date-search-input').showPicker(); toggleMenu();">🔍 Buscar Fecha</button>
            <button class="menu-item" id="mic-btn-menu" onclick="startSpeechRecognition(); toggleMenu();">🎤 Dictar Nota</button>
            <button class="menu-item" onclick="openPocket(); toggleMenu();">📌 Notas de Bolsillo</button>
            <button class="menu-item" onclick="openSummary(); toggleMenu();">📋 Ver todas las notas</button>
            <button class="menu-item" onclick="goToToday(); toggleMenu();">📅 Ir a Hoy</button>
            <button class="menu-item" onclick="toggleSettings(); toggleMenu();">⚙️ Ajustes</button>
        </div>
    </nav>
       <div class="wood-background">
         <header class="top-bar">
             <!-- Botón Hamburguesa --> 
         <div class="cabecera">   
    <img src="img/Juanjo.ico" class="ico" width="35">       
             </div>
             <button class="hamburger-btn" onclick="toggleMenu()" title="Menú">☰</button>
             
             <div class="date-info">
                <span id="month-year">---</span>
                <small id="week-display">Semana --</small>
            </div>

            <!-- Nuevo elemento para el reloj -->
            <div id="clock-display" class="clock-box">00:00:00</div>
            
            <!-- Input oculto sigue aquí para ser funcional -->
            <input type="date" id="date-search-input" onchange="jumpToDate(this.value)">
        </header>

        <div class="notebook-container is-closed" id="swipe-area">
            
            <!-- PORTADA DE LA LIBRETA -->
            <div class="notebook-cover" id="notebook-cover" onclick="openNotebook()">
                <div class="cover-decoration"></div>
                <h1 id="cover-title">AGENDA</h1>
                <p>Mi Plan Semanal</p>
                <div class="cover-decoration"></div>
                <small style="color:rgba(255,215,0,0.5); font-style:italic;">Clic para abrir</small>
            </div>

            <div class="page left-page">
                <div class="lines-container" id="lines-l"></div>
            </div>

            <div class="spiral">
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
                <div class="ring"></div><div class="ring"></div><div class="ring"></div>
            </div>

            <div class="page right-page">
                <div class="lines-container" id="lines-r"></div>
            </div>
        </div>
    </div>

    <!-- MODAL DE AJUSTES -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Ajustes de Agenda</h3>
            
            <div class="setting-item">
                <label>Tu Nombre:</label>
                <input type="text" id="setting-name" oninput="applySettings()" placeholder="Ej: Juan">
            </div>

            <div class="setting-item">
                <label>Color Portada:</label>
                <select id="setting-cover-color" onchange="applySettings()">
                    <option value="brown">Marrón Cuero</option>
                    <option value="blue">Azul Marino</option>
                    <option value="green">Verde Bosque</option>
                    <option value="black">Negro Elegante</option>
                    <option value="red">Rojo Vino</option>
                </select>
            </div>

            <div class="setting-item">
                <label>Vista:</label>
                <select id="setting-view" onchange="applySettings()">
                    <option value="double">Abierta (2 días)</option>
                    <option value="single">Simple (1 día)</option>
                </select>
            </div>

            <div class="setting-item">
                <label>Papel:</label>
                <select id="setting-paper" onchange="applySettings()">
                    <option value="plain">Blanco</option>
                    <option value="ruled">Rayado</option>
                    <option value="grid">Cuadriculado</option>
                </select>
            </div>

            <div class="setting-item">
                <label>Tamaño Letra:</label>
                <select id="setting-font-size" onchange="applySettings()">
                    <option value="small">Pequeño</option>
                    <option value="medium">Normal</option>
                    <option value="large">Grande</option>
                </select>
            </div>

            <hr>
            <h4>Copia de Seguridad</h4>
            <div class="backup-btns">
                <button class="btn-backup" onclick="exportData()">📤 Exportar</button>
                <button class="btn-backup" onclick="document.getElementById('import-file').click()">📥 Importar</button>
                <input type="file" id="import-file" style="display:none" accept=".json" onchange="importData(event)">
            </div>

            <hr>
            <h4>Acciones</h4>
            <button class="btn-block" onclick="closeNotebook(); toggleSettings();">📕 Cerrar Libreta</button>
            <button class="btn-block" style="color: #a32a2a; font-weight: bold; margin-top: 10px;" onclick="clearAllData()">⚠️ Borrar toda la agenda</button>
            <button class="btn-block" style="background:#333; color:white; margin-top:20px" onclick="toggleSettings()">Cerrar</button>
        </div>
    </div>

    <!-- MODAL DE BOLSILLO -->
    <div id="pocket-modal" class="modal-overlay">
        <div class="modal-content pocket-style">
            <div class="pocket-pin">📌</div>
            <h3>Notas de Bolsillo</h3>
            <p style="font-size: 0.8rem; margin-top: -10px; opacity: 0.7;">Ideas y listas que no caducan</p>
            <textarea id="pocket-textarea" placeholder="Escribe aquí tus notas generales..." oninput="savePocketData()"></textarea>
            <button class="btn-block" style="background:rgba(0,0,0,0.1); border:none; margin-top:10px" onclick="closePocket()">Guardar y Cerrar</button>
        </div>
    </div>

    <!-- MODAL DE RESUMEN -->
    <div id="summary-modal" class="modal-overlay">
        <div class="modal-content wide">
            <h3>Índice de Notas</h3>
            <div id="summary-list-container" class="summary-list"></div>
            <button class="btn-block" style="background:#333; color:white; margin-top:20px" onclick="closeSummary()">Cerrar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
